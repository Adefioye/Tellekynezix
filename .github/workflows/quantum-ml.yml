name: Quantum ML

on:
  pull_request:
    paths:
      - "quantum-ml/**"
      - ".github/workflows/quantum-ml.yml"
  push:
    branches:
      - main
    paths:
      - "quantum-ml/**"
      - ".github/workflows/quantum-ml.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: quantum-ml/pyproject.toml

      - name: Install quantum ML environment
        run: python -m pip install -e "./quantum-ml[dev]"

      - name: Check installed dependencies
        run: python -m pip check

      - name: Run tests
        run: python -m pytest quantum-ml/tests -v

      - name: Run Bell-circuit example
        run: python quantum-ml/examples/bell_circuit.py

      - name: Run hybrid-model example
        run: python quantum-ml/examples/train_hybrid_model.py

