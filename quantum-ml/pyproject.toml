[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-ml-environment"
version = "0.1.0"
description = "Reproducible PennyLane and PyTorch environment for quantum ML experiments"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
dependencies = [
    "pennylane==0.45.1",
    "tqdm==4.70.1",
    "torch==2.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
